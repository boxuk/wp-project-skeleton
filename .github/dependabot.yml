version: 2
updates:
    # Main app.
    -   package-ecosystem: composer
        directory: "/"
        registries: "*"
        schedule:
            interval: daily
        open-pull-requests-limit: 10
        commit-message:
            prefix: "[DEPS]"
        ignore:
            # Ignore PHPUnit major updates as WordPress only supports version 7 and below.
            - dependency-name: "phpunit/phpunit"
              update-types: ["version-update:semver-major"]

    # GitHub Actions.
    -   package-ecosystem: github-actions
        directory: "/"
        schedule:
            interval: daily
        open-pull-requests-limit: 10
        commit-message:
            prefix: "[DEPS]"

    # Node Deps.
    -   package-ecosystem: npm
        directory: "/"
        registries: "*"
        schedule:
            interval: daily
        open-pull-requests-limit: 10
        commit-message:
            prefix: "[DEPS]"
        ignore:
          - dependency-name: "@wordpress/*"
          - dependency-name: "react"
          - dependency-name: "react-dom"


    # Docker images float on patch versions (e.g. php:8.2-fpm, nginx:1.30), so
    # patches arrive via bin/docker/rebuild rather than Dependabot. PHP versions
    # are changed via PHP_VERSION / docker/app/php8.x folders, not here.

    # Docker node image.
    -   package-ecosystem: docker
        directory: "/docker/node"
        registries: "*"
        schedule:
            interval: daily
        open-pull-requests-limit: 10
        commit-message:
            prefix: "[SETUP]"
        ignore:
            - dependency-name: "*"
              update-types: ["version-update:semver-major"]

    # Docker nginx image.
    # Only merge even minors (stable line); close odd-minor (mainline) PRs.
    -   package-ecosystem: docker
        directory: "/docker/nginx"
        registries: "*"
        schedule:
            interval: daily
        open-pull-requests-limit: 10
        commit-message:
            prefix: "[SETUP]"
